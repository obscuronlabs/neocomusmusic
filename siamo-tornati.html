    position:absolute; left:0; right:0; bottom:0;

    color:var(--ink);
    font-weight:600;
    font-size:0.92rem;

  .platform.is-disabled{

</style>

  function applyLang(lang){

    document.querySelectorAll('.langswitch button').forEach(function(b){

    document.documentElement.setAttribute('lang', lang);
    try { localStorage.setItem('st-lang', lang); } catch(e){}
  }

  document.querySelectorAll('.langswitch button').forEach(function(b){
    b.addEventListener('click', function(){ applyLang(b.getAttribute('data-setlang')); });

    if (saved && DICT[saved]) startLang = saved;

    hero.removeAttribute('id');
  }

  // ---- Staged reveal: periscope image shows alone first, then title/song fade in ----
  var heroContent = document.getElementById('heroContent');
  var revealDelay = window.matchMedia('(prefers-reduced-motion: reduce)').matches ? 0 : 1000;
  setTimeout(function(){ heroContent.classList.add('is-in'); }, revealDelay);
</script>
